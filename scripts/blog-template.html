<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | CVR Guitars Blog</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/cvrguitars-logo.svg">
    <link rel="stylesheet" href="../../css/fonts.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/blog.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">
                <a href="../../index.html">
                    <img src="../../assets/cvrguitars-logo.svg" alt="CVR Guitars Logo">
                </a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../../projects.html">Projects</a></li>
                <li><a href="../../about.html">About</a></li>
                <li><a href="../../blog.html" class="active">Blog</a></li>
                <li><a href="../../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="blog-post">
            <h1>{{TITLE}}</h1>
            <div class="blog-meta">
                <span class="date">{{DATE}}</span>
                <span class="author">by {{AUTHOR}}</span>
            </div>
            {{CONTENT}}
        </article>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <h4>CVR Guitars</h4>
                <p>Crafting premium custom guitars since 2020</p>
            </div>
            <div class="footer-contact">
                <p>Get in touch</p>
                <a href="../../contact.html" class="btn">Contact Us</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 CVR Guitars. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
            this.classList.toggle('active');
        });
    </script>
</body>
</html>
